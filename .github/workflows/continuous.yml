name: Continuous Integration
on:
  push:
    branches:
      - main
jobs:
  gradle:
    name: Build Gradle project
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
      #      - name: Setup Gradle
      #        uses: gradle/actions/setup-gradle@v4
      - name: Install OpenAPI Generator
        run: ./gradlew :shared:openapi-gen:publishToMavenLocal
      - name: Check Project
        run: ./gradlew test check koverXmlReport -DisCi=1
      #        run: ./gradlew clean test koverXmlReport --no-daemon
      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@master
        with:
          args: >
            -Dsonar.organization=seepick
            -Dsonar.projectKey=seepick_diamond
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
            -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/kover/report.xml
