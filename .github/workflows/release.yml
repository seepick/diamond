name: Build Release

on:
  # invoke manually
  workflow_dispatch:
    inputs:
      version:
        description: 'The version number to be used'
        required: true
        default: '2025.12.1'
        type: string
# to access GitHub maven repo (called packages)
env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
