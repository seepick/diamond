  # ==> tag_name: ${{ steps.date.outputs.date }}
  #          release_name: ${{ steps.date.outputs.date }}

  log-info:
    name: Print some debug info
    environment: main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Log Info
        # e.g.: "ref refs/tags/1 and ref_name 1"
        run: |
          echo "The given version number is: ${{ github.event.inputs.version }}"
          echo "This job is using ref ${{ github.ref }} and ref_name ${{ github.ref_name }}"

  build-and-verify-project:
    name: Build and verify (test, check) project assembly
    environment: main
    runs-on: ubuntu-latest
    # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
    permissions:
      contents: write
    steps:
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests and check application
        run: ./gradlew check
      # TODO here require quality gate (sonarqube); better triggger other build for us (reuse)
      - name: Build JAR
        # for auto releease, change version number algorithm here
        run: ./gradlew :app:buildFatJar -Ddiamond_version="${{ github.event.inputs.version }}" -Ddiamond_branch="${{ github.ref}}"
      - name: Generate config documentation
        run: ./gradlew :app:generateConfigDoc
      - name: Build Software Documentation PDF
        run: ./gradlew :doc:SoftwareDocument:asciidoctorPdf -Ddiamond_version="${{ github.event.inputs.version }}"

  create-github-release:
    name: Creating GitHub Release
    environment: main
    runs-on: ubuntu-latest
    # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
    permissions:
      contents: write
    steps:
      - name: Tag version
        uses: .... tag... FIXME!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.version }}
      - name: Create Release # https://github.com/marketplace/actions/create-tag-release
        id: create_release
        uses: actions/create-release@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.version }}
          release_name: Release v${{ github.event.inputs.version }}
          body: No changelog provided
          draft: false
          prerelease: false
    outputs:
      upload-url: ${{ steps.create_release.outputs.upload_url }}

  upload-release-artifacts:
    name: Uploading release build artifacts
    environment: main
    runs-on: ubuntu-latest
    needs:
      - build-and-verify-project
      - create-github-release
    permissions:
      contents: write
    steps:
      - name: Upload Application JAR
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.prepare-release.outputs.upload-url }}
          asset_path: app/build/libs/diamond.jar
          asset_name: diamond.jar
          asset_content_type: application/java-archive

      - name: Upload SoftwareDocument PDF
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.prepare-release.outputs.upload-url }}
          asset_path: doc/SoftwareDocument/build/docs/asciidocPdf/index.pdf
          asset_name: Diamond-SoftwareDocument.pdf
          asset_content_type: application/pdf
