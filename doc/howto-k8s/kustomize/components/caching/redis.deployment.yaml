apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-cache-deployment
spec:
  selector:
    matchLabels:
      app: my-cache-pod
  template:
    metadata:
      labels:
        app: my-cache-pod
    spec:
      containers:
        - name: my-cache-container
          image: redis
          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"
