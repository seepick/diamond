# kubectl apply -f manifests/deploy-demoapp.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: demo-app
          image: demo-app:latest
          # local image: https://kubernetes.io/docs/concepts/containers/images/#updating-images
          imagePullPolicy: Never
          # otherwise we are warned for being a "noisy neighbor"
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
# kubectl get pod <pod-id> -o jsonpath='{.spec.containers[0].imagePullPolicy}'
