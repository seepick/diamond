openapi: 3.0.0
info:
  version: 1.0.0
  title: Test API
paths:
  /dogs:
    get:
      description: Return all dogs
      tags: [ "Dogs" ]
      operationId: "getAllDogs"
      responses:
        "200":
          description: Successful response
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/DogList"

  /dogs/{id}:
    get:
      description: Returns a dog by its ID
      tags: [ "Dogs" ]
      operationId: "getDog"
      parameters:
        - name: id
          in: path
          required: true
          description: The dog's ID.
          schema:
            type: integer
      responses:
        "200":
          description: Successful response
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Dog"
        "404":
          description: Dog not found

components:
  schemas:
    DogList:
      type: array
      description: a list of dogs
      items:
        $ref: "#/components/schemas/Dog"
    Dog:
      type: object
      description: a loyal friend to the human
      required:
        - id
        - name
      properties:
        id:
          type: integer
          description: the dogs number, always number one of course
        name:
          type: string
          description: call him, he will be there
